##########################
# Required configuration #
##########################

# Project key will also be used for binary file
sonar.projectKey=mcruncher_worshipsongs-flutter
sonar.projectName=worshipsongs-flutter
sonar.language=dart

# Path to source directories
sonar.sources=lib
# Path to test directories (comment if no test)
sonar.tests=test

##########################
# Optional configuration #
##########################

sonar.test.inclusions=**/*_test.dart

# Encoding of the source code
sonar.sourceEncoding=UTF-8

##########################
# Code Coverage #
##########################

sonar.dart.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/ui/views/**,**/ui/widgets/**,**/ui/data/**,**/ui/theme/**,**/ui/extensions/**,**/ui/localization/**,**/auth_gate.dart,**/main.dart,**/firebase_options.dart,**/auth_repository_impl.dart,**/*providers.dart,**/*provider.dart,**/*.g.dart,**/*.freezed.dart

